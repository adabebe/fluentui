name: Pull request housekeeping 🧹
run-name: 'PR risk assessment #${{ github.event.pull_request.number }}'
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  # Serialize risk-label writes across heads; obsolete reruns must not cancel an active writer.
  group: pr-housekeeping-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Every job declares only the permissions it needs.
permissions: {}

jobs:
  label:
    name: Label areas
    # Area labels depend on the changed files only, as before the risk pilot; a pilot failure cannot affect them.
    # Runs on every event: the shared concurrency group may replace a pending push run with a later edit run.
    if: ${{ github.repository_owner == 'microsoft' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
          configuration-path: .github/labeler.yml

  snapshot:
    name: Prepare risk assessment
    if: ${{ github.repository_owner == 'microsoft' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      checks: write
    outputs:
      check-id: ${{ steps.policy.outputs.check-id }}
      base-sha: ${{ steps.policy.outputs.base-sha }}
      identity: ${{ steps.policy.outputs.identity }}
    steps:
      # Runs before any checkout, so it cannot require risk-policy.js; the identity must equal revisionKey()
      # (risk-workflow-setup.test.ts checks this).
      - name: Invalidate the previous risk assessment before setup
        id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { createHash } = require('node:crypto');
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            if (pull.head.sha !== context.payload.pull_request.head.sha) {
              core.notice('Superseded PR head; leaving the current assessment untouched.');
              return;
            }
            const identity = createHash('sha256')
              .update(JSON.stringify([pull.head.sha, pull.base.sha, pull.base.ref, pull.base.repo.full_name, pull.title, pull.body]))
              .digest('hex');
            const { data: check } = await github.rest.checks.create({
              ...context.repo,
              name: 'PR risk assessment',
              head_sha: pull.head.sha,
              external_id: identity,
              status: 'in_progress',
            });
            core.setOutput('check-id', String(check.id));
            core.setOutput('base-sha', pull.base.sha);
            core.setOutput('identity', identity);

  assess:
    # Native job metadata belongs to this trusted run; a custom check name is not provenance.
    name: 'Assess PR #${{ github.event.pull_request.number }} revision ${{ needs.snapshot.outputs.identity }}'
    needs: snapshot
    if: ${{ needs.snapshot.outputs.check-id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      # Exchanged for a short-lived Entra token for the optional risk model; there is no stored model key.
      id-token: write
    steps:
      # Never check out or execute PR-head code in pull_request_target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.snapshot.outputs.base-sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/risk-tiers.json
            scripts/github
          sparse-checkout-cone-mode: false

      - name: Classify review risk
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RISK_POLICY_CHECK_ID: ${{ needs.snapshot.outputs.check-id }}
          RISK_POLICY_IDENTITY: ${{ needs.snapshot.outputs.identity }}
          RISK_DECISION_ENDPOINT: ${{ vars.RISK_DECISION_ENDPOINT }}
          RISK_MODEL_MODE: ${{ vars.RISK_MODEL_MODE }}
          RISK_CLASSIFIER_AZURE_CLIENT_ID: ${{ vars.RISK_CLASSIFIER_AZURE_CLIENT_ID }}
          RISK_CLASSIFIER_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/github/src/risk-tiers-workflow.js`);
            await run({
              github, context, core,
              checkRun: {
                id: Number(process.env.RISK_POLICY_CHECK_ID),
                identity: process.env.RISK_POLICY_IDENTITY,
              },
            });

      # The classify step completes the check itself, also when it fails; this covers setup failures and cancellation.
      - name: Fail the risk check if setup or classification did not finish
        if: ${{ always() && steps.classify.outputs.check-completed != 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RISK_POLICY_CHECK_ID: ${{ needs.snapshot.outputs.check-id }}
        with:
          script: |
            await github.rest.checks.update({
              ...context.repo,
              check_run_id: Number(process.env.RISK_POLICY_CHECK_ID),
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Risk classification did not finish',
                summary: 'Setup, classification, or cancellation prevented certification. No new tier is certified.',
              },
            });
